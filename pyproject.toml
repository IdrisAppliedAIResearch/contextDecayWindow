[project]
name = "context-decay-window"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # The extracted library (CC-002): the harness is a consumer of episodic,
    # installed editable from the in-repo package.
    "episodic",
    "llama-cpp-python>=0.3.0",
    "sqlite-vec>=0.1.0",
    "numpy>=1.26.0",
    # Study 006: locked sentence segmenter and NER extractor for span selection.
    # The model wheel is pinned by URL because spaCy models are not on PyPI.
    "spacy>=3.8.14,<4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
episodic = { path = "episodic", editable = true }

[tool.uv]
dev-dependencies = [
    "hnswlib==0.8.0",
    "matplotlib>=3.10.0",
    "pytest>=8.0.0",
]
