[project]
name = "episodic-chat"
version = "0.3.0"
readme = "README.md"
description = "Chronological relevance memory with optional last-32 continuity and no generative retrieval calls."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# The default embedder loads a GGUF model through llama.cpp. The import is
# lazy: the base install carries no inference runtime.
llama = ["llama-cpp-python>=0.3.0"]
aspect = [
    "spacy>=3.8.14,<4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/episodic"]
